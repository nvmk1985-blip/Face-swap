name: Build Android Mobile APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      build_type:
        description: "APK Build Variant (debug)"
        required: false
        default: "debug"

permissions:
  contents: write

jobs:
  build-apk:
    name: Assemble FaceSwap Studio Mobile APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Configure Android SDK & Accept Licenses
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          mkdir -p "$ANDROID_SDK_ROOT/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n8933bad161af4178b1185d1a37fbf41ea5269c55\n" > "$ANDROID_SDK_ROOT/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b84351f2910\n" > "$ANDROID_SDK_ROOT/licenses/android-sdk-preview-license"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Ensure Debug Keystore and .env Exist
        run: |
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            cp .env.example .env
          fi
          if [ ! -f "debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug Mobile APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare FaceSwap-Studio.apk
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk FaceSwap-Studio.apk
          ls -lh FaceSwap-Studio.apk

      - name: Upload Mobile APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FaceSwap-Studio-Mobile-APK
          path: FaceSwap-Studio.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish Direct APK to GitHub Releases (One-Click Mobile Download)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f latest-apk
          git push origin -f latest-apk
          if gh release view latest-apk >/dev/null 2>&1; then
            gh release upload latest-apk FaceSwap-Studio.apk --clobber
          else
            gh release create latest-apk FaceSwap-Studio.apk \
              --title "FaceSwap Studio Mobile APK (Latest Build)" \
              --notes "Direct installable Android APK for FaceSwap Studio (Offline Face Swap + GHOST Head Replacement)."
          fi
          DIRECT_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/latest-apk/FaceSwap-Studio.apk"
          echo "=================================================================="
          echo "DIRECT MOBILE APK DOWNLOAD LINK:"
          echo "$DIRECT_URL"
          echo "=================================================================="
          echo "## 📱 Download FaceSwap Studio Android APK" >> $GITHUB_STEP_SUMMARY
          echo "👉 **[⬇️ Click Here to Download FaceSwap-Studio.apk Directly]($DIRECT_URL)**" >> $GITHUB_STEP_SUMMARY
